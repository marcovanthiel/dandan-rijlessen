# Cloudflare Workers Static Assets — Dandan's rijlessen (dandandrive.nl)
# Statische site; build-output in ./dist (via `node build.js`). Zelfde opzet als
# onze andere sites. Custom domains (dandandrive.nl + www; artnijmegen.nl redirect) worden via de
# Cloudflare-API aan de worker gekoppeld (niet via routes hier, dat vereist
# extra zone-permissie op de CI-token).
name = "dandan-rijlessen"
main = "worker.js"
compatibility_date = "2024-12-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "dandandrive"
database_id = "5c85b137-b21b-4048-aeb2-0a13542815ad"
